spring.application.name=atm-banking-application
server.port=8080

# Session configuration (60 seconds idle timeout as specified in prompt, default 15m for dev testing)
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=JSESSIONID

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/atm_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (for debugging and academic inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging configuration
logging.level.root=INFO
logging.level.com.bank.atm=DEBUG
logging.level.org.springframework.web=INFO
