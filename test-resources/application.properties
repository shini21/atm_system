spring.application.name=atm-banking-application-test

# H2 In-Memory Database for Isolated Testing
spring.datasource.url=jdbc:h2:mem:atm_test_db;DB_CLOSE_DELAY=0
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 Console for Tests
spring.h2.console.enabled=false

# Test logging
logging.level.com.bank.atm=INFO

