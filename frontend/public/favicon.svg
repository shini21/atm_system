<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Chassis -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#090A0F" stroke="#1F2937" stroke-width="2" />
  <!-- Accent Inner Border -->
  <rect x="8" y="8" width="48" height="48" rx="10" fill="url(#grad)" />
  <!-- Screen Recess -->
  <rect x="14" y="14" width="36" height="24" rx="4" fill="#0B0F17" stroke="#34D399" stroke-width="1.5" />
  <!-- Cash Slot Below Screen -->
  <rect x="18" y="44" width="28" height="3" rx="1.5" fill="#10B981" filter="url(#glow)" />
  <!-- Monogram AP inside Screen -->
  <text x="32" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#10B981" text-anchor="middle" letter-spacing="1">AP</text>
  <!-- Status LED pip -->
  <circle cx="46" cy="18" r="1.5" fill="#34D399" />
</svg>
